name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Get date 📅
        id: meta
        run: echo "date=$(TZ=Africa/Cairo date +'%Y-%m-%d')" >> $GITHUB_OUTPUT

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Install host build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            autoconf pkgconf libtool ninja-build \
            python3-pip gperf nasm
          sudo pip3 install meson

      - name: Download SDK/NDK + sources
        working-directory: buildscripts
        run: ./download.sh

      # Compiles native libmpv/ffmpeg ONLY for arm64
      - name: Build native libs (arm64-v8a)
        working-directory: buildscripts
        run: ./buildall.sh --arch arm64 mpv

      # Copies native libs in AND runs Gradle assemble
      - name: Build mpv-android (native lib copy + Gradle assemble)
        working-directory: buildscripts
        run: ./buildall.sh -n

      - name: List generated APKs
        run: find app/build/outputs/apk -name "*.apk"

      - name: Decode keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE }}" | base64 -d > release.keystore

      - name: Align and sign APK
        run: |
          UNSIGNED_APK=$(find app/build/outputs/apk/allstorage/release -name "*arm64-v8a*-unsigned.apk" | head -n 1)
          if [ -z "$UNSIGNED_APK" ]; then
            echo "::error::No allstorage arm64-v8a release APK found — listing all APKs for debugging:"
            find app/build/outputs/apk -name "*.apk"
            exit 1
          fi
          echo "Unsigned APK: $UNSIGNED_APK"

          ZIPALIGN=$(find "${{ github.workspace }}/buildscripts" -name "zipalign" -type f | head -n 1)
          APKSIGNER=$(find "${{ github.workspace }}/buildscripts" -name "apksigner" -type f | head -n 1)

          if [ -z "$ZIPALIGN" ] || [ -z "$APKSIGNER" ]; then
            echo "::error::Could not locate zipalign/apksigner under buildscripts/"
            find "${{ github.workspace }}/buildscripts" -maxdepth 4 -type d
            exit 1
          fi

          "$ZIPALIGN" -v -p 4 "$UNSIGNED_APK" app-allstorage-arm64-v8a-release-aligned.apk

          "$APKSIGNER" sign \
            --ks release.keystore \
            --ks-pass pass:"${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" \
            --ks-key-alias "${{ secrets.ANDROID_KEY_ALIAS }}" \
            --key-pass pass:"${{ secrets.ANDROID_KEY_PASSWORD }}" \
            --out app-allstorage-arm64-v8a-release-signed.apk \
            app-allstorage-arm64-v8a-release-aligned.apk

          "$APKSIGNER" verify app-allstorage-arm64-v8a-release-signed.apk
          echo "Signed and verified."

      - name: Clean up keystore
        if: always()
        run: rm -f release.keystore

      - name: Upload signed release APK
        uses: actions/upload-artifact@v7
        with:
          name: mpv-android-arm64-allstorage-release-signed
          path: app-allstorage-arm64-v8a-release-signed.apk
          if-no-files-found: error

      - name: Upload to GitHub Release 📤
        uses: softprops/action-gh-release@da05d552573ad5aba039eaac05058a918a7bf631 # v2.2.2
        with:
          tag_name: ${{ steps.meta.outputs.date }}
          name: "Build ${{ steps.meta.outputs.date }}"
          files: app-allstorage-arm64-v8a-release-signed.apk
          token: ${{ secrets.GITHUB_TOKEN }}
